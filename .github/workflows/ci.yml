name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write  # OIDC authentication for Codecov (no token secret needed)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      # Part of the required `test` check: a broken model or dbt test fails the PR.
      # Runs offline on the recorded fixtures, landed as `make extract` would.
      - name: dbt build on the fixtures
        run: |
          day=data/01_raw/siata/pm25/2026-10-10
          mkdir -p "$day" data/01_raw/siata/historical
          cp tests/fixtures/siata/pm25_stations.json "$day/stations.json"
          for code in 12 81; do cp "tests/fixtures/siata/pm25_72h_$code.json" "$day/$code.json"; done
          cp tests/fixtures/siata/historical_pm25.json data/01_raw/siata/historical/pm25.json
          make load transform dbt-docs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: true

  # The daily ELT runs only on schedule, so a broken workflow would fail silently.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
