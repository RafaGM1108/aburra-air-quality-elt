name: Release

# Pushing a tag vX.Y.Z creates the GitHub release, with the notes of the matching
# "## [X.Y.Z]" section of CHANGELOG.md. Run by hand, it releases the version in
# pyproject.toml and creates its tag on the current commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -z "$TAG" ]; then
            TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
            target=(--target "$GITHUB_SHA")
          else
            target=(--verify-tag)
          fi
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $version"; exit 1; }
          gh release create "$TAG" --title "$TAG" --notes-file notes.md "${target[@]}"
