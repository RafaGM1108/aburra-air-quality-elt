name: Release

# Pushing a tag vX.Y.Z creates the GitHub release, with the notes of the matching
# "## [X.Y.Z]" section of CHANGELOG.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $version"; exit 1; }
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
