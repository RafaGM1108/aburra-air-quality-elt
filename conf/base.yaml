# Project configuration. Paths are relative to the project root.
# Override the file location with the ABURRA_AIR_CONF environment variable.
project:
  name: aburra-air-quality-elt
  random_seed: 42

# ELT layers: 01_raw = landing JSON, 02_intermediate = dbt intermediate,
# 03_primary = dbt staging, 05_model_input = dbt marts, 08_reporting = analysis outputs.
paths:
  raw: data/01_raw
  intermediate: data/02_intermediate
  primary: data/03_primary
  model_input: data/05_model_input
  reporting: data/08_reporting
  # DuckDB file: raw tables from the load step plus the dbt models.
  database: data/03_primary/aburra_air.duckdb
  dbt_project: dbt
  # Aggregated marts staged for the public data release (never hourly data).
  publish: build/publish

logging:
  level: INFO

# Data-quality checks run by `make quality` after each ELT run; any failure fails the run.
quality:
  # The 72 h series ends ~7 h before real time; more than this means SIATA stopped updating.
  max_lag_hours: 36
  # Hourly rows the latest run folder must provide (23 stations x 72 h when complete).
  min_rows_latest_run: 1000
  # Stations with at least one valid hour in the last 24 h of the latest series.
  min_stations_last_24h: 15

# Analyses (`make analyze`) cover this window: the 12 full months of the historical
# backfill, the only complete year available (see docs/data.md).
analysis:
  start: 2023-08-01
  end: 2024-07-31
  # Stations with fewer valid days than this share of the window are listed but not ranked.
  min_coverage: 0.75

params: {}
