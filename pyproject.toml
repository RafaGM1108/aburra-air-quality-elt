[project]
name = "aburra-air-quality-elt"
version = "1.0.0"
description = "ELT pipeline and dashboard for air quality in the Aburrá Valley (Medellín, Colombia)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rafael E. Garcia" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]
app = [
    "plotly>=7.1.0",
    "streamlit>=1.40",
]
docs = ["mkdocs-material>=9.5"]

[tool.uv]
default-groups = ["dev", "app", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aburra_air"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"**/__main__.py" = ["D"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Tests import shared fixtures as `tests.conftest`; map files to modules from the src/ and root bases.
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# plotly ships no type information.
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

# --- bandit -----------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

# --- pytest / coverage ------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not live'"
markers = ["live: calls the real SIATA API; run with `make contract` (weekly in CI)"]

[tool.coverage.run]
source = ["aburra_air"]
branch = true
# The Streamlit UI runs in AppTest smoke tests (tests/app) but under its own runner, and
# `python -m` entry points are thin; neither is measured.
omit = ["*/app/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
